name: iOS CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    # Using macOS 15 runner for latest Xcode and iOS simulator support
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache DerivedData
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.xcodeproj') }}

    - name: Install dependencies
      run: bundle install

    # Testing with iPhone 15 simulator (latest available on GitHub Actions)
    # Timeout set to prevent hung builds from consuming CI minutes
    - name: Build and Test
      timeout-minutes: 30
      run: |
        set -o pipefail
        xcodebuild test \
          -project DrinkTracker.xcodeproj \
          -scheme "DrinkTracker Dev" \
          -destination "platform=iOS Simulator,name=iPhone 15" \
          -only-testing:DrinkTrackerTests \
          ENABLE_SWIFT_TESTING=YES \
          | xcpretty && exit ${PIPESTATUS[0]}
